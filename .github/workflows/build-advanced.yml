name: VISO Studio advanced APK

on:
  push:
    branches:
      - viso/advanced-studio-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout VISO Studio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = []
          pos = 0
          while True:
              start = html.find("<script", pos)
              if start < 0:
                  break
              tag_end = html.find(">", start)
              end = html.find("</script>", tag_end)
              if tag_end < 0 or end < 0:
                  raise SystemExit("Malformed script tag")
              scripts.append(html[tag_end + 1:end])
              pos = end + len("</script>")
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          ids = re.findall('id="([^"]+)"', html)
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate HTML id detected")
          required_ids = (
              "songInfo", "recInfo", "bLoop", "bStopAtEnd",
              "studioHeader", "topExport", "bUndo", "bRedo",
              "bProjectSave", "bProjectOpen", "sVhsScan", "sShockStrength",
              "sLensAmount", "sProgThickness", "sLogoGlow", "bSurfaceReflection",
              "studioText2", "bText2On", "sText2Size", "sText2Glow",
              "bFilm", "sFilmGrain", "sFilmDust", "sFilmScratches",
              "bAtmosphere", "sHaze", "sSmoke", "specRangeModes",
              "bSpecTrail", "sSpecTrailAmount", "specGlowMode", "bSpecGlowIntensitySync",
              "bSpecShake", "sSpecShake", "bSpecWaveDelay", "sSpecWaveDelayTime",
              "bSpecWaveReverse", "specWaveGradient"
          )
          for required in required_ids:
              if required not in ids:
                  raise SystemExit(f"Missing required UI element: {required}")
          for removed in ("toolSearch", "toolFavorites", "toolFilters", "bAuto", "kCol", "kVis", "kShp", "kSwy"):
              if f'id="{removed}"' in html:
                  raise SystemExit(f"Removed clutter control is still present: {removed}")
          # Custom logo must render once through the dedicated Logo tool, never again in the legacy Overlay stage.
          if html.count("drawCustomLogo(ctx)") != 2:
              raise SystemExit("Custom logo must have one function definition and exactly one render call")
          if "'Overlay':{stage:'overlay',order:10,render:ctx=>{drawVignette(ctx);drawProgress(ctx);drawCustomLogo(ctx);}}" in html:
              raise SystemExit("Legacy Overlay stage still draws the custom logo twice")
          if "'Logo':{stage:'overlay',order:65,render:ctx=>drawCustomLogo(ctx)}" not in html:
              raise SystemExit("Dedicated Logo render stage is missing")
          for required_source in (
              "VISO_TOOL_REGISTRY", "viso-project-v3", "function visoZip",
              "function visoUnzip", "function visoCRC32", "Project asset checksum failed",
              "restoreVISOProjectAssets", "AndroidSave.appendChunk", "drawFilmEffect",
              "drawAtmosphere", "drawSurfaceReflection", "drawStudioTextLayer",
              "specTrailBuffers", "drawSpectrumLayerGeometry(ctx,scale,layer,true)",
              "specTrailOn,specTrailAmount", "specGlowIntensitySync", "specGlowMode",
              "waveY[i+1]", "specWaveReverse?n-1-i:i"
          ):
              if required_source not in html:
                  raise SystemExit(f"Missing required VISO module: {required_source}")
          if "watermark" in html.lower():
              raise SystemExit("Watermark code/UI is forbidden in VISO")
          Path("/tmp/viso-inline.js").write_text(chr(10).join(scripts), encoding="utf-8")
          print(f"HTML checks passed: {len(ids)} unique IDs, {len(scripts)} script blocks")
          PY
          node --check /tmp/viso-inline.js

      - name: Test VISO project archive integrity
        run: node scripts/test-project-archive.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify packaged APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" assets/index.html > /tmp/viso-apk-index.html
          cmp app/src/main/assets/index.html /tmp/viso-apk-index.html
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.viso.lite'"
          echo "APK verified: package com.viso.lite; embedded studio HTML exactly matches source"

      - name: Upload VISO Studio APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VISO-Studio-advanced-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
