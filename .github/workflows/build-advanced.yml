name: VISO Studio advanced APK

on:
  push:
    branches:
      - viso/advanced-studio-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout VISO Studio branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("app/src/main/assets/index.html")
          html = p.read_text(encoding="utf-8")
          scripts = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          ids = re.findall(r'\\bid=["\\']([^"\\']+)["\\']', html)
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate HTML id detected")
          for required in ("songInfo", "recInfo", "bLoop", "bStopAtEnd"):
              if required not in ids:
                  raise SystemExit(f"Missing required UI element: {required}")
          Path("/tmp/viso-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          print(f"HTML checks passed: {len(ids)} unique IDs, {len(scripts)} script blocks")
          PY
          node --check /tmp/viso-inline.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload VISO Studio APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VISO-Studio-advanced-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
