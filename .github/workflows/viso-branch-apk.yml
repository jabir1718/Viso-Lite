name: VISO Good Working Visualizer APK

on:
  push:
    branches: [viso/good-working-visualizer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current VISO branch
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"
      - name: Generate Gradle wrapper
        run: gradle :wrapper --gradle-version 8.11.1
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload VISO APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VISO-Good-Working-Visualizer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
